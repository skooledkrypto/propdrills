  <script>
    // Stamp the resolved theme before first paint to avoid a flash.
    try {
      var p = localStorage.getItem('dm.theme');
      document.documentElement.dataset.theme =
        p === 'light' || p === 'dark'
          ? p
          : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.cb = localStorage.getItem('dm.cb') === '1' ? '1' : '0';
    } catch (e) { document.documentElement.dataset.theme = 'dark'; }
  </script>
